# Anonymized Home Assistant dashboard. Replace every example_* entity.
views:
  -
    title: "Tablet"
    type: "panel"
    cards:
      -
        type: "custom:kitchen-atlas"
    path: "tablet"
  -
    type: "sections"
    max_columns: 3
    title: "Topení"
    path: "topeni"
    sections:
      -
        type: "grid"
        cards:
          -
            type: "vertical-stack"
            cards:
              -
                type: "entities"
                card_mod:
                  style: "ha-card {\n  background: transparent;\n  box-shadow: none;\n}\n"
                entities:
                  -
                    entity: "sensor.example_daily_electricity"
                    type: "custom:multiple-entity-row"
                    name: "Denní spotřeba elektriky"
                    format: "precision1"
                    icon: "none"
                  -
                    entity: "sensor.example_monthly_electricity"
                    type: "custom:multiple-entity-row"
                    name: "Měsíční spotřeba elektriky"
                    format: "precision1"
                    icon: "none"
                  -
                    entity: "sensor.example_yearly_electricity"
                    type: "custom:multiple-entity-row"
                    name: "Roční spotřeba elektriky"
                    format: "precision1"
                    icon: "none"
                  -
                    type: "section"
                  -
                    entity: "sensor.example_daily_gas"
                    type: "custom:multiple-entity-row"
                    name: "Denní spotřeba plynu"
                    format: "precision1"
                    icon: "none"
                  -
                    entity: "sensor.example_monthly_gas"
                    type: "custom:multiple-entity-row"
                    name: "Měsíční spotřeba plynu"
                    format: "precision1"
                    icon: "none"
                  -
                    entity: "sensor.example_yearly_gas"
                    type: "custom:multiple-entity-row"
                    name: "Roční spotřeba plynu"
                    format: "precision1"
                    icon: "none"
            grid_options:
              columns: 12
              rows: 5.5
            card_mod:
              style: "ha-card {\n  background: transparent;\n  box-shadow: none;\n}\n"
          -
            type: "vertical-stack"
            card_mod:
              style: "ha-card {\n  background: transparent;\n  box-shadow: none;\n}\n"
            cards:
              -
                type: "entities"
                card_mod:
                  style: ":host {\n  margin: 0px !important;\n }\n ha-card {\n   background: transparent;\n   box-shadow: none;\n   padding: 0px !important; \n }\n"
                entities:
                  -
                    entity: "sensor.example_outdoor_aux_humidity"
                    type: "custom:multiple-entity-row"
                    name: "Venku"
                    format: "precision1"
                    icon: "mdi:weather-partly-cloudy"
                    entities:
                      -
                        entity: "sensor.example_outdoor_aux_temperature"
                        name: false
                        format: "precision1"
                  -
                    type: "section"
                  -
                    entity: "sensor.example_room_3_humidity"
                    type: "custom:multiple-entity-row"
                    name: "Místnost 3"
                    icon: "mdi:bed"
                    format: "precision1"
                    entities:
                      -
                        entity: "sensor.example_room_3_temperature"
                        name: false
                        format: "precision1"
                  -
                    entity: "sensor.example_room_1_humidity"
                    type: "custom:multiple-entity-row"
                    name: "Pokoj 1"
                    format: "precision1"
                    icon: "mdi:teddy-bear"
                    entities:
                      -
                        entity: "sensor.example_room_1_temperature"
                        name: false
                        format: "precision1"
                  -
                    entity: "sensor.example_room_2_humidity"
                    type: "custom:multiple-entity-row"
                    name: "Pokoj 2"
                    format: "precision1"
                    icon: "mdi:teddy-bear"
                    entities:
                      -
                        entity: "sensor.example_room_2_temperature"
                        name: false
                        format: "precision1"
                  -
                    entity: "sensor.example_room_4_humidity"
                    type: "custom:multiple-entity-row"
                    name: "Kuchyň"
                    format: "precision1"
                    icon: "mdi:countertop"
                    entities:
                      -
                        entity: "sensor.example_room_4_temperature"
                        name: false
                        format: "precision1"
                  -
                    type: "section"
                  -
                    entity: "sensor.example_indoor_humidity"
                    type: "custom:multiple-entity-row"
                    name: "Vnitřní prostředí"
                    format: "precision1"
                    icon: "mdi:home-thermometer-outline"
                    entities:
                      -
                        entity: "sensor.example_indoor_temperature"
                        name: false
                        format: "precision1"
                grid_options:
                  columns: 10
                  rows: 5.5
            grid_options:
              columns: 12
              rows: "auto"
          -
            type: "thermostat"
            entity: "climate.example_thermostat"
            name: "Termostat"
            grid_options:
              columns: 12
              rows: 5
            show_current_as_primary: false
        column_span: 3
      -
        type: "grid"
        cards:
          -
            type: "thermostat"
            name: "Obecný termostat"
            grid_options:
              columns: 12
              rows: 6
            entity: "climate.example_secondary_thermostat"
        column_span: 3
    icon: "mdi:thermometer"
    cards: []
    header: {}
  -
    type: "sections"
    max_columns: 4
    title: "Kamera"
    path: "kamera"
    icon: "mdi:webcam"
    sections:
      -
        type: "grid"
        cards:
          -
            camera_view: "live"
            fit_mode: "cover"
            type: "picture-glance"
            entities: []
            camera_image: "camera.example_camera_1"
            grid_options:
              columns: "full"
              rows: 8
            aspect_ratio: "70%"
          -
            camera_view: "live"
            fit_mode: "cover"
            type: "picture-glance"
            entities: []
            camera_image: "camera.example_camera_3"
            grid_options:
              columns: 24
              rows: 8
            aspect_ratio: "70%"
        column_span: 4
    cards: []
title: "Tablet"
